{% macro navbar(user, active='') %}
<nav class="main-nav">
  <div class="nav-inner">
    <a href="/home" class="nav-brand">
      <span class="nav-icon">🛡️</span>
      <span class="nav-name">Health IQ</span>
    </a>
    <div class="nav-links">
      <a href="/home" class="{% if active=='home' %}active{% endif %}">Home</a>
      <a href="/plans" class="{% if active=='plans' %}active{% endif %}"
        >Plans</a
      >
      <a href="/recommend" class="{% if active=='recommend' %}active{% endif %}"
        >Recommend</a
      >
      <a href="/advisor" class="{% if active=='advisor' %}active{% endif %}"
        >AI Advisor</a
      >
      <a
        href="/calculator"
        class="{% if active=='calculator' %}active{% endif %}"
        >Calculator</a
      >
      <a href="/analytics" class="{% if active=='analytics' %}active{% endif %}"
        >Analytics</a
      >
      <a href="/hospitals" class="{% if active=='hospitals' %}active{% endif %}"
        >Hospitals</a
      >
    </div>
    <div class="nav-right">
      <span class="nav-user">👋 {{ user }}</span>
      <a href="/logout" class="nav-logout">Logout</a>
    </div>
    <button class="nav-hamburger" onclick="toggleMobileNav()">☰</button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="/home">Home</a>
    <a href="/plans">Plans</a>
    <a href="/recommend">Recommend</a>
    <a href="/advisor">AI Advisor</a>
    <a href="/calculator">Calculator</a>
    <a href="/analytics">Analytics</a>
    <a href="/hospitals">Hospitals</a>
    <a href="/logout">Logout</a>
  </div>
</nav>
<style>
  .main-nav {
    background: #060d1a;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .nav-inner {
    max-width: 1400px;
    margin: auto;
    padding: 0 32px;
    height: 62px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .nav-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #00c8b4, #2ecc71);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .nav-name {
    font-family: "Playfair Display", serif;
    color: white;
    font-size: 18px;
    font-weight: 700;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .nav-links a {
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 7px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-links a:hover,
  .nav-links a.active {
    color: white;
    background: rgba(255, 255, 255, 0.08);
  }
  .nav-links a.active {
    color: #00c8b4;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .nav-user {
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    white-space: nowrap;
  }
  .nav-logout {
    padding: 7px 16px;
    background: rgba(231, 76, 60, 0.15);
    color: #e74c3c;
    border-radius: 7px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.2s;
  }
  .nav-logout:hover {
    background: rgba(231, 76, 60, 0.25);
  }
  .nav-hamburger {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    margin-left: auto;
  }
  .mobile-menu {
    display: none;
    flex-direction: column;
    background: #0e1929;
    padding: 16px 32px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .mobile-menu a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    padding: 10px 0;
    font-size: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .mobile-menu.open {
    display: flex;
  }
  @media (max-width: 1100px) {
    .nav-links {
      display: none;
    }
    .nav-user {
      display: none;
    }
    .nav-hamburger {
      display: block;
    }
  }
</style>
<script>
  function toggleMobileNav() {
    document.getElementById("mobileMenu").classList.toggle("open");
  }
</script>
{% endmacro %}
