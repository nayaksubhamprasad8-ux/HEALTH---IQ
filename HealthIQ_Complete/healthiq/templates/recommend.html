<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recommendations — Health IQ</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    {% from 'macros.html' import navbar %}
    <link rel="stylesheet" href="/static/css/main.css"/>
    <style>
        .rec-layout { display: grid; grid-template-columns: 380px 1fr; gap: 28px; padding: 36px 0; }
        .score-bar-bg { background: rgba(255,255,255,0.07); border-radius: 100px; height: 6px; margin-top: 6px; }
        .score-bar-fill { height: 6px; border-radius: 100px; background: linear-gradient(90deg, var(--teal), var(--green)); transition: width 0.8s; }
        .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; transition: border-color 0.2s; }
        .rec-card:hover { border-color: rgba(0,200,180,0.3); }
        .rec-rank { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .rec-rank-1 { color: #f59e0b; }
        .rec-plan-name { color: white; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .rec-company { font-size: 12px; color: var(--teal); margin-bottom: 12px; }
        .rec-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
        .rec-m { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px; text-align: center; }
        .rec-m-val { font-size: 14px; font-weight: 800; color: white; }
        .rec-m-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .rec-score { display: flex; align-items: center; gap: 10px; }
        .rec-score-val { font-size: 22px; font-weight: 900; color: var(--green); }
        .rec-actions { display: flex; gap: 10px; margin-top: 14px; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color 0.2s; }
        .checkbox-item:has(input:checked) { border-color: var(--teal); background: rgba(0,200,180,0.05); }
        .checkbox-item input { accent-color: var(--teal); width: 16px; height: 16px; }
        .checkbox-item label { font-size: 13px; color: var(--text); cursor: pointer; }
        @media (max-width: 900px) { .rec-layout { grid-template-columns: 1fr; } .rec-metrics { grid-template-columns: repeat(2,1fr); } }
    </style>
</head>
<body class="dark-bg">
{{ navbar(user, 'recommend') }}

<div class="page-header">
    <div class="container">
        <h1>🎯 Smart Recommendations</h1>
        <p>Our scoring engine matches plans to your exact needs</p>
    </div>
</div>

<div class="page-body">
    <div class="container">
        <div class="rec-layout">
            <!-- Form Panel -->
            <div>
                <div class="card">
                    <div class="card-title">Your Preferences</div>
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" id="age" class="form-input" value="30" min="1" max="80" placeholder="Your age">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Plan Type</label>
                        <select id="plan_type" class="form-select">
                            <option value="Individual">Individual</option>
                            <option value="Family">Family Floater</option>
                            <option value="Senior">Senior Citizen</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Annual Budget (₹)</label>
                        <input type="number" id="budget" class="form-input" value="30000" placeholder="e.g. 30000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Coverage Needed (₹)</label>
                        <input type="number" id="coverage_needed" class="form-input" value="500000" placeholder="e.g. 500000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Top Priority</label>
                        <select id="priority" class="form-select">
                            <option value="balanced">Balanced (Rating)</option>
                            <option value="claim">Claim Settlement Rate</option>
                            <option value="hospital">Hospital Network Size</option>
                            <option value="coverage">Maximum Coverage</option>
                        </select>
                    </div>
                    <button class="btn-primary btn-full" onclick="getRecommendations()" id="recBtn">
                        Get My Top Recommendations →
                    </button>
                </div>
            </div>

            <!-- Results Panel -->
            <div id="resultsPanel">
                <div class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <h3 style="color:white;margin-bottom:8px;">Your recommendations will appear here</h3>
                    <p>Fill in your preferences and click "Get My Top Recommendations"</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function getRecommendations() {
    const btn = document.getElementById('recBtn');
    btn.innerHTML = '<span class="spinner"></span> Analyzing...';
    btn.disabled = true;

    const payload = {
        age: parseInt(document.getElementById('age').value),
        plan_type: document.getElementById('plan_type').value,
        budget: parseInt(document.getElementById('budget').value),
        coverage_needed: parseInt(document.getElementById('coverage_needed').value),
        priority: document.getElementById('priority').value
    };

    try {
        const res = await fetch('/api/recommend', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const plans = await res.json();
        renderResults(plans);
    } catch(e) {
        document.getElementById('resultsPanel').innerHTML = '<div class="error-box">Error fetching recommendations. Please try again.</div>';
    } finally {
        btn.innerHTML = 'Get My Top Recommendations →';
        btn.disabled = false;
    }
}

function renderResults(plans) {
    if (!plans.length) {
        document.getElementById('resultsPanel').innerHTML = '<div class="error-box">No plans found matching your criteria.</div>';
        return;
    }
    const ranks = ['🥇 Best Match', '🥈 2nd Choice', '🥉 3rd Choice', '4th Match', '5th Match'];
    let html = `<div style="color:white;font-size:16px;font-weight:700;margin-bottom:20px;">Top ${plans.length} Plans for You</div>`;
    plans.forEach((p, i) => {
        const scoreWidth = Math.min(100, p.score);
        const cov = parseInt(p.Coverage_Limit).toLocaleString('en-IN');
        const prem = parseInt(p.Annual_Premium).toLocaleString('en-IN');
        const isTop = i === 0 ? 'rec-rank-1' : '';
        html += `
        <div class="rec-card">
            <div class="rec-rank ${isTop}">${ranks[i] || `#${i+1}`}</div>
            <div class="rec-plan-name">${p.Plan_Name}</div>
            <div class="rec-company">${p.Company}</div>
            <div class="rec-metrics">
                <div class="rec-m"><div class="rec-m-val">₹${prem}</div><div class="rec-m-label">Annual</div></div>
                <div class="rec-m"><div class="rec-m-val">₹${cov}</div><div class="rec-m-label">Coverage</div></div>
                <div class="rec-m"><div class="rec-m-val">${p.Claim_Settlement_Ratio_Percent}%</div><div class="rec-m-label">CSR</div></div>
                <div class="rec-m"><div class="rec-m-val">⭐ ${p.Rating}</div><div class="rec-m-label">Rating</div></div>
            </div>
            <div class="rec-score">
                <div class="rec-score-val">${p.score}</div>
                <div style="flex:1">
                    <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">Match Score</div>
                    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${scoreWidth}%"></div></div>
                </div>
                ${p.Wellness_Benefit === 'Yes' ? '<span class="tag tag-purple">✦ Wellness</span>' : ''}
            </div>
            <div class="rec-actions">
                <a href="/plans" class="btn-secondary" style="padding:8px 16px;font-size:13px;">View All Plans</a>
            </div>
        </div>`;
    });
    document.getElementById('resultsPanel').innerHTML = html;
}
</script>
</body>
</html>
